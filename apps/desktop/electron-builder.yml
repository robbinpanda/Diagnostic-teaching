appId: cn.ai4edu.diagnostic-teaching
productName: 诊断式数学答疑
artifactName: Diagnostic-Teaching-Setup-${version}-${arch}.${ext}

directories:
  output: ../../dist/windows/installer

asar: true
electronDist: node_modules/electron/dist

files:
  - src/main.cjs
  - src/data-reset.cjs
  - package.json

extraResources:
  - from: ../../dist/windows/api
    to: api
  - from: ../web/out
    to: web
  - from: ../../dist/windows/seed
    to: seed

win:
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker

nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: 诊断式数学答疑
  uninstallDisplayName: 诊断式数学答疑
